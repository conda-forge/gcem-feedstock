{% set name = "gcem" %}
{% set version = "1.18.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/kthohr/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: 8e71a9f5b62956da6c409dda44b483f98c4a98ae72184f3aa4659ae5b3462e61
  patches:
    # CMake 4 removed compatibility with cmake_minimum_required < 3.5; see kthohr/gcem#54
    - patches/0001-cmake-minimum-required.patch

build:
  number: 1
  # Header-only: the installed headers and CMake config are identical on every
  # platform; only the file layout differs (Library\ prefix on Windows), so one
  # noarch variant is built per OS family (see noarch_platforms in conda-forge.yml).
  noarch: generic

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - cmake
    - make  # [unix]
  run:
    - __unix  # [unix]
    - __win  # [win]

test:
  commands:
    - test -f ${PREFIX}/include/gcem.hpp  # [unix]
    - test -f ${PREFIX}/lib/cmake/gcem/gcemConfig.cmake  # [unix]
    - if not exist %LIBRARY_PREFIX%\include\gcem.hpp exit 1  # [win]
    - if not exist %LIBRARY_PREFIX%\lib\cmake\gcem\gcemConfig.cmake exit 1  # [win]

about:
  home: https://github.com/kthohr/gcem
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: 'GCE-Math (Generalized Constant Expression Math): templated C++ library.'
  description: 'GCE-Math (Generalized Constant Expression Math): templated C++ library.'
  doc_url: https://gcem.readthedocs.io
  dev_url: https://github.com/kthohr/gcem

extra:
  recipe-maintainers:
    - tdegeus
    - backmari
